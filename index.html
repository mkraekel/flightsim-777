<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>777 Flight Deck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l1.2 5 5.8 2.5v1.3l-5.8-1.3-.4 4 1.7 1.3V15L8 14l-2.5 1v-1.2l1.7-1.3-.4-4L1 9.8V8.5L6.8 6z%22 fill=%22%23ddd%22/%3E%3C/svg%3E">
  <meta name="description" content="Browser Boeing 777-300ER flight simulator on a CesiumJS globe.">

  <!-- CesiumJS 1.145.0 (global `Cesium`). CESIUM_BASE_URL must be set before the library loads. -->
  <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/';</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js" async id="cesium-lib"></script>

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/menu.css">
  <link rel="stylesheet" href="styles/displays.css">
  <link rel="stylesheet" href="styles/mcp.css">
  <link rel="stylesheet" href="styles/cdu.css">
  <link rel="stylesheet" href="styles/overhead.css">
  <link rel="stylesheet" href="styles/pedestal.css">
  <link rel="stylesheet" href="styles/touch.css">
</head>
<body class="view-cockpit booting">
  <div id="app">
    <div id="world" aria-label="Out-the-window view"></div>

    <div id="cockpit" aria-label="Flight deck">
      <div id="glareshield">
        <div id="efis-l" class="gs-unit" aria-label="EFIS control panel"></div>
        <div id="mcp" class="gs-unit" aria-label="Mode control panel"></div>
      </div>
      <div id="main-panel">
        <div class="mp-row">
          <div class="du-bezel"><div id="pfd" class="du" aria-label="Primary flight display"></div></div>
          <div class="du-bezel"><div id="nd" class="du" aria-label="Navigation display"></div></div>
          <div class="mp-center">
            <div class="du-bezel du-bezel--small"><div id="isfd" class="du" aria-label="Standby flight display"></div></div>
            <div class="mp-placard"><span>B777-300ER</span><span class="mp-placard__sub">MAX TAXI 352 400 KG</span></div>
          </div>
          <div class="du-bezel"><div id="eicas" class="du" aria-label="Upper EICAS"></div></div>
        </div>
      </div>
      <nav id="drawer-dock" aria-label="Cockpit panels">
        <button type="button" data-drawer="overhead" title="Overhead panel (1)">OVHD</button>
        <button type="button" data-drawer="pedestal" title="Pedestal (2)">PED</button>
        <button type="button" data-drawer="cdu" title="CDU (3)">CDU</button>
        <button type="button" data-drawer="lower" title="Lower EICAS (4)">LWR</button>
      </nav>
    </div>

    <aside id="drawer-overhead" class="drawer drawer--right" aria-label="Overhead panel"></aside>
    <aside id="drawer-pedestal" class="drawer drawer--bottom" aria-label="Pedestal"></aside>
    <aside id="drawer-cdu" class="drawer drawer--right drawer--narrow" aria-label="Control display unit"></aside>
    <aside id="drawer-lower" class="drawer drawer--right drawer--square" aria-label="Lower EICAS"></aside>

    <div id="touch-ui"></div>
    <div id="hud" aria-live="off"></div>
    <div id="menu"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
